<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AXM Material Lab — surface response organs</title>
<style>
:root{--bg:#070a12;--panel:#0e1524;--line:#243350;--ink:#e7eefc;--dim:#93a4c6;--key:#63a6ff;--ok:#5fe3c0;--hold:#ffb454;
 --mono:ui-monospace,SFMono-Regular,Menlo,monospace;--body:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:light){:root:not([data-t=dark]){--bg:#eef2fa;--panel:#fff;--line:#c9d4ea;--ink:#101828;--dim:#4a5a80;--key:#1f5fd0;--ok:#0a7a5c;--hold:#a35a00}}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:1100px;margin:auto;padding:.8rem .7rem 3rem;display:grid;gap:.8rem}
h1{font:600 1.05rem/1.2 var(--body);margin:0}h1 small{display:block;font:400 .78rem/1.5 var(--body);color:var(--dim)}
button,select,input[type=text]{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:.4rem .7rem;min-height:38px;cursor:pointer}
button.go{background:var(--key);border-color:var(--key);color:#04101f;font-weight:600}
button[aria-pressed=true]{border-color:var(--key);box-shadow:inset 0 0 0 1px var(--key)}
select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:.4rem;min-height:38px;max-width:100%}
.stage{background:#05070d;border:1px solid var(--line);border-radius:10px;padding:.5rem;display:grid;gap:.5rem;justify-items:center}
canvas{width:100%;max-width:340px;height:auto;image-rendering:auto;border-radius:8px;touch-action:none}
.row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;display:grid;gap:.5rem;min-width:0}
.card h2{font:600 .92rem var(--body);margin:0;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.tag{font:11.5px var(--mono);border:1px solid var(--line);border-radius:5px;padding:.05rem .35rem;color:var(--dim);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.hold{color:var(--hold);border-color:var(--hold)}
label.sl{display:grid;grid-template-columns:1fr auto;gap:.1rem .5rem;font-size:.8rem;color:var(--dim);align-items:center}
label.sl input[type=range]{grid-column:1/-1;width:100%;min-width:0;accent-color:var(--key);min-height:30px}
label.sl output{font:12px var(--mono);color:var(--ink)}
.sw{display:flex;gap:.3rem;align-items:center;font-size:.8rem;color:var(--dim)}
.note{font-size:.8rem;color:var(--dim);margin:0}
pre{margin:0;font:11.5px/1.45 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:16rem;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:.5rem}
.grid{display:grid;gap:.8rem}@media(min-width:900px){.grid{grid-template-columns:minmax(0,360px) minmax(0,1fr);align-items:start}.left{position:sticky;top:.7rem;display:grid;gap:.8rem}}
.toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--panel);border:1px solid var(--key);border-radius:8px;padding:.5rem .8rem;font-size:.86rem;max-width:92vw;z-index:9}

<body>
<div class="wrap">
  <h1>AXM Material Lab<small>Eight surface response organs, bound and adjustable. Nothing here is saved anywhere — export what you want to keep.</small></h1>

<div class="toast" id="toast" hidden role="status"></div>
<script>/*!
 * axm-material-organs — reference host, shading
 *
 * This file BINDS the organ records in ../organs to something executable. It is a reference, not a
 * production renderer: it is real-time-style (analytic lobes, no path tracing), single-scatter, and
 * every approximation it makes is the one named in that organ's `known_losses` or `fallback`.
 *
 * Its purpose is to make each organ's `verify` case runnable, so evidence can be earned rather than
 * claimed. A receipt produced here is `verified_render_receipt` FOR THIS HOST ONLY. UC's own
 * renderer starts again at declared_contract_match_not_tested — that is the point of known_losses.
 *
 * Zero dependencies. Node and browser.
 */
'use strict';

// ── small vector helpers
const v3 = (x, y, z) => [x, y, z];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const mulv = (a, b) => [a[0] * b[0], a[1] * b[1], a[2] * b[2]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = (a) => Math.sqrt(dot(a, a));
const norm = (a) => { const l = len(a) || 1; return mul(a, 1 / l); };
const clamp = (x, lo, hi) => (x < lo ? lo : x > hi ? hi : x);
const sat = (x) => clamp(x, 0, 1);
const mix = (a, b, k) => a + (b - a) * k;
const mixv = (a, b, k) => [mix(a[0], b[0], k), mix(a[1], b[1], k), mix(a[2], b[2], k)];

// ── deterministic noise, object space (organ: surface.breakup requires this)
function ihash(x, y, z, seed) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(z | 0, 2147483647) + Math.imul(seed | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise3(p, seed) {
  const i = p.map(Math.floor), f = p.map((x, k) => x - i[k]), s = f.map((x) => x * x * (3 - 2 * x));
  let acc = 0;
  for (let c = 0; c < 8; c++) {
    const dx = c & 1, dy = (c >> 1) & 1, dz = (c >> 2) & 1;
    const w = (dx ? s[0] : 1 - s[0]) * (dy ? s[1] : 1 - s[1]) * (dz ? s[2] : 1 - s[2]);
    acc += w * ihash(i[0] + dx, i[1] + dy, i[2] + dz, seed);
  }
  return acc;
}
function fbm(p, octaves, seed) {
  let a = 0, amp = 1, tot = 0, q = p;
  for (let o = 0; o < octaves; o++) { a += amp * vnoise3(q, seed + o * 17); tot += amp; amp *= 0.5; q = mul(q, 2.03); }
  return a / (tot || 1);
}

// ── microfacet pieces
const fresnelSchlick = (f0, c) => { const k = Math.pow(1 - sat(c), 5); return [f0[0] + (1 - f0[0]) * k, f0[1] + (1 - f0[1]) * k, f0[2] + (1 - f0[2]) * k]; };
function ggx(nh, a) { const a2 = a * a, d = nh * nh * (a2 - 1) + 1; return a2 / (Math.PI * d * d + 1e-9); }
function ggxAniso(th, bh, nh, ax, ay) { // organ: surface.anisotropy
  const t = th / Math.max(ax, 1e-4), b = bh / Math.max(ay, 1e-4);
  const w = t * t + b * b + nh * nh;
  return 1 / (Math.PI * Math.max(ax, 1e-4) * Math.max(ay, 1e-4) * w * w + 1e-9);
}
function smith(nl, nv, a) { const k = a * a / 2; return (nl / (nl * (1 - k) + k + 1e-9)) * (nv / (nv * (1 - k) + k + 1e-9)); }

// ── organ: surface.iridescence — thin-film hue, specular tint only
function thinFilm(thicknessNm, ior, cosTheta) {
  const sinT = Math.sqrt(Math.max(0, 1 - cosTheta * cosTheta)) / ior;
  const cosT = Math.sqrt(Math.max(0, 1 - sinT * sinT));
  const opd = 2 * ior * thicknessNm * cosT;            // optical path difference
  const wl = [612, 549, 465];                           // representative R, G, B wavelengths (nm)
  return wl.map((w) => 0.5 + 0.5 * Math.cos((2 * Math.PI * opd) / w));
}

// ── view-independent channels, in ONE place
// Everything a texture could legitimately hold: base colour, roughness, metallic, and where the
// wear layers sit. Used by shade() and by tools/bake.js, so a baked map and a live render cannot
// disagree about what the surface is.
function staticChannels(resp, P, N, V) {
  const r = resp || {};
  let albedo = (r.base_color || [0.6, 0.6, 0.6]).slice();
  let rough = clamp(r.roughness === undefined ? 0.5 : r.roughness, 0.03, 1);
  let metal = clamp(r.metallic || 0, 0, 1);
  const bk = r.breakup;
  if (bk) {
    const q = mul(P, 100 / Math.max(0.05, bk.scale_mm || 2));    // 1 object unit = 100mm
    const n = fbm(q, bk.octaves || 2, (bk.seed || 7) | 0) - 0.5;
    if (bk.roughness_variation) rough = clamp(rough + n * 2 * bk.roughness_variation, 0.02, 1);
    if (bk.color_variation) { const n2 = fbm(mul(P, 100 / Math.max(0.05, (bk.scale_mm || 2) * 2.7)), 2, ((bk.seed || 7) + 5) | 0) - 0.5;
      albedo = albedo.map((c) => clamp(c * (1 + (n * 1.2 + n2 * 0.8) * 2 * bk.color_variation), 0, 1)); }
  }
  const masks = [];
  if (r.layers && r.layers.length) {
    const step = (e0, e1, x) => { const t = sat((x - e0) / Math.max(1e-5, e1 - e0)); return t * t * (3 - 2 * t); };
    const grime = fbm(mul(P, 5.3), 3, 21), fine = fbm(mul(P, 17.0), 2, 44);
    const edge = V ? sat(1 - Math.abs(dot(N, V))) : sat(1 - Math.abs(N[1]));   // no view when baking: use a geometric stand-in
    for (const L of r.layers) {
      const where = L.where || 'cavities';
      const raw = where === 'high_wear_edges' ? step(0.52, 0.72, edge * 0.55 + fine * 0.65)
        : where === 'upward_faces' ? step(0.45, 0.62, sat(N[1]) * 0.6 + grime * 0.6)
          : where === 'folds' ? step(0.5, 0.62, fine)
            : step(0.46, 0.64, grime * 0.7 + fine * 0.45);
      masks.push({ layer: L, k: sat(raw * (L.weight === undefined ? 1 : L.weight)) });
    }
  }
  return { albedo, roughness: rough, metallic: metal, masks };
}

// ── the response: every organ bound, in one place
// A `response` is the pack's own shape: base_color, roughness, metallic, specular and the organ keys.
function shade(resp, geo, lights, env) {
  const N0 = geo.N, V = geo.V, P = geo.P;
  const r = resp || {};

  // organ: surface.breakup — computed once, in staticChannels, so a bake matches a render
  const chan = staticChannels(r, P, N0, V);
  let albedo = chan.albedo, rough = chan.roughness;

  // organ: surface.wear_layer — blend COMPLETE responses by placement, never per channel
  if (chan.masks.length) {
    // Blend COMPLETE responses by placement, one after another, never per channel.
    let out2 = shade(Object.assign({}, r, { layers: undefined }), geo, lights, env);
    for (const m of chan.masks) {
      if (m.k <= 0.002) continue;
      out2 = mixv(out2, shade(Object.assign({}, r, m.layer, { layers: undefined, note: undefined }), geo, lights, env), m.k);
    }
    return out2;
  }

  const metal = chan.metallic;
  const specLevel = r.specular === undefined ? 0.5 : r.specular;
  const f0 = metal > 0 ? albedo.slice() : [0.08 * specLevel, 0.08 * specLevel, 0.08 * specLevel];
  const diffCol = mul(albedo, 1 - metal);

  // organ: surface.anisotropy — tangent frame comes from the part, not UVs
  const an = r.anisotropy;
  let T = null, B = null, ax = rough * rough, ay = rough * rough;
  if (an && an.strength) {
    const up = Math.abs(N0[1]) > 0.95 ? v3(1, 0, 0) : v3(0, 1, 0);
    T = norm(cross(up, N0)); B = cross(N0, T);
    if (an.rotation) { const a = an.rotation * Math.PI * 2, c = Math.cos(a), s = Math.sin(a); const T2 = add(mul(T, c), mul(B, s)); B = sub(mul(B, c), mul(T, s)); T = T2; }
    const aniso = clamp(an.strength, -0.98, 0.98);
    ax = clamp(rough * rough * (1 + aniso), 0.002, 1);
    ay = clamp(rough * rough * (1 - aniso), 0.002, 1);
  }

  // organ: surface.coat — a second lobe, and energy removed from what is under it
  const coat = r.clearcoat, coatW = coat ? clamp(coat.weight || 0, 0, 1) : 0;
  const coatRough = coat ? clamp(coat.roughness === undefined ? 0.05 : coat.roughness, 0.01, 1) : 0.05;
  const coatF0 = coat && coat.ior ? Math.pow((coat.ior - 1) / (coat.ior + 1), 2) : 0.04;

  // organ: surface.subsurface — wrapped transport, per channel (the fallback named in the record)
  const ss = r.subsurface, ssW = ss ? clamp(ss.weight || 0, 0, 1) : 0;
  const ssRad = ss && ss.radius_mm ? ss.radius_mm : [1, 1, 1];
  const ssTint = ss && ss.tint ? ss.tint : [1, 1, 1];
  const wrap = ssRad.map((mm) => clamp(mm / 6, 0, 0.95));

  // organ: surface.transmission — thin wall fallback: light arriving from behind leaves toward us
  const tr = r.transmission, trW = typeof tr === 'number' ? tr : tr && tr.weight ? tr.weight : 0;
  const trTint = r.transmission_tint || (r.absorption && r.absorption.color) || [1, 1, 1];

  // organ: surface.sheen
  const sh = r.sheen, shW = sh ? clamp(sh.weight || 0, 0, 1) : 0;
  const shRough = sh ? clamp(sh.roughness === undefined ? 0.3 : sh.roughness, 0.05, 1) : 0.3;
  const shTint = sh && sh.tint ? sh.tint : [1, 1, 1];

  // organ: surface.iridescence
  const ir = r.iridescence, irW = ir ? clamp(ir.weight || 0, 0, 1) : 0;

  let out = [0, 0, 0];
  const coatOut = [0, 0, 0];
  const nv = sat(dot(N0, V));

  for (const L of lights) {
    const Ldir = L.dir, Lcol = L.color, nl = dot(N0, Ldir);
    const H = norm(add(Ldir, V)), nh = sat(dot(N0, H)), vh = sat(dot(V, H));

    // diffuse, wrapped per channel when subsurface is bound
    const plain = sat(nl);
    const diff = [0, 1, 2].map((c) => {
      if (ssW <= 0) return plain;
      const w = wrap[c];
      const wrapped = sat((nl + w) / (1 + w));
      return mix(plain, wrapped * mix(1, 0.85, w), ssW);
    });
    const ssColor = [0, 1, 2].map((c) => mix(diffCol[c], diffCol[c] * ssTint[c] * 1.35, ssW * (1 - sat(nl)) * 0.9));
    for (let c = 0; c < 3; c++) out[c] += ssColor[c] * diff[c] * Lcol[c] / Math.PI * 2.1;

    if (plain > 0) {
      // specular, isotropic or anisotropic
      let D;
      if (T) { D = ggxAniso(dot(T, H), dot(B, H), nh, ax, ay); } else { D = ggx(nh, Math.max(rough * rough, 0.002)); }
      const G = smith(plain, Math.max(nv, 1e-3), rough);
      let F = fresnelSchlick(f0, vh);
      if (irW > 0) { const film = thinFilm((ir.thickness_nm || 400) + (ir.thickness_variation_nm || 0) * (fbm(mul(P, 2.0), 2, 33) - 0.5) * 2, ir.ior || 1.4, vh); F = F.map((f, c) => mix(f, f * film[c] * 1.6, irW)); }
      const specK = (D * G) / (4 * Math.max(plain, 1e-3) * Math.max(nv, 1e-3) + 1e-6);
      for (let c = 0; c < 3; c++) out[c] += F[c] * specK * plain * Lcol[c];

      // coat on top: its own lobe, accumulated apart from the layer beneath (see below for the dimming)
      if (coatW > 0) {
        const Dc = ggx(nh, Math.max(coatRough * coatRough, 0.0006));
        const Fc = coatF0 + (1 - coatF0) * Math.pow(1 - vh, 5);
        const specC = (Dc * smith(plain, Math.max(nv, 1e-3), coatRough)) / (4 * Math.max(plain, 1e-3) * Math.max(nv, 1e-3) + 1e-6);
        const k = coatW * Fc;
        coatOut[0] += k * specC * plain * Lcol[0] * (coat && coat.tint ? coat.tint[0] : 1);
        coatOut[1] += k * specC * plain * Lcol[1] * (coat && coat.tint ? coat.tint[1] : 1);
        coatOut[2] += k * specC * plain * Lcol[2] * (coat && coat.tint ? coat.tint[2] : 1);
      }

      // metallic flake, sitting under the coat (car paint)
      if (r.flake && r.flake.weight) {
        const f = r.flake, cells = fbm(mul(P, 260 / Math.max(0.02, f.size_mm || 0.1)), 1, 91);
        const sparkle = Math.pow(sat(cells * 1.25 - 0.32), 6) * 18 * f.weight;
        const fc = f.color || [1, 1, 1];
        for (let c = 0; c < 3; c++) out[c] += sparkle * fc[c] * plain * Lcol[c] * 0.35;
      }
    }

    // sheen: retroreflective, strongest where the surface turns away from the eye
    if (shW > 0) {
      const rim = Math.pow(1 - nv, 1 / Math.max(shRough, 0.05) * 0.9 + 0.8);
      const lobe = rim * Math.pow(sat(nl + 0.35), 0.6);
      for (let c = 0; c < 3; c++) out[c] += shW * lobe * shTint[c] * Lcol[c] * 0.9;
    }

    // transmission: thin wall means light from behind leaves toward the viewer
    if (trW > 0) {
      const back = sat(dot(mul(N0, -1), Ldir));
      const through = Math.pow(back, tr && tr.thin_wall === false ? 1.5 : 1.0);
      const dist = r.absorption ? clamp((r.absorption.distance_mm || 10) / 40, 0.05, 4) : 1;
      for (let c = 0; c < 3; c++) out[c] += trW * through * trTint[c] * Lcol[c] * (1.6 / dist);
    }
  }

  // a two-tone environment so nothing sits in pure black; sky above, ground bounce below
  if (env !== false) {
    const up = sat(N0[1] * 0.5 + 0.5);
    const amb = mixv([0.10, 0.09, 0.08], [0.16, 0.19, 0.26], up);
    let envSpec = f0.map((f) => f * 0.6 * (1 - rough));
    if (irW > 0) { const film = thinFilm((ir.thickness_nm || 400) + (ir.thickness_variation_nm || 0) * (fbm(mul(P, 2.0), 2, 33) - 0.5) * 2, ir.ior || 1.4, nv);
      envSpec = envSpec.map((e, c) => mix(e, Math.max(e, 0.10) * film[c] * 3.4, irW)); }
    for (let c = 0; c < 3; c++) out[c] += diffCol[c] * amb[c] * 0.8 * (1 - 0.5 * metal) + envSpec[c] * amb[c] * 3.2;
    if (shW > 0) { const rim = Math.pow(1 - nv, 2.2); for (let c = 0; c < 3; c++) out[c] += shW * rim * shTint[c] * amb[c] * 1.2; }
  }
  if (coatW > 0) {
    const fcv = coatF0 + (1 - coatF0) * Math.pow(1 - nv, 5), dim = 1 - coatW * fcv * 0.45;
    for (let c = 0; c < 3; c++) out[c] = out[c] * dim + coatOut[c];
  }
  return out;
}

const ORGAN_KEYS = { subsurface: 'surface.subsurface', sheen: 'surface.sheen', anisotropy: 'surface.anisotropy', clearcoat: 'surface.coat', breakup: 'surface.breakup', transmission: 'surface.transmission', iridescence: 'surface.iridescence', layers: 'surface.wear_layer', flake: 'surface.coat', absorption: 'surface.transmission' };
const organsUsed = (resp) => Object.keys(resp || {}).filter((k) => ORGAN_KEYS[k]).map((k) => ORGAN_KEYS[k]).filter((v, i, a) => a.indexOf(v) === i).sort();

window.__shade = { shade, staticChannels, organsUsed, ORGAN_KEYS, fbm, vnoise3, norm, dot, cross, add, sub, mul, mulv, v3, sat, mix, mixv, thinFilm };
</script>
<script>const S = window.__shade;
/*!
 * axm-material-organs — reference host, rendering
 * Analytic ray/sphere so normals are exact and nothing here is a tessellation artefact.
 * Lights: key, fill, and a back light (the back light is what makes transmission and sheen testable).
 */
'use strict';


const LIGHTS = {
  studio: [
    { dir: S.norm([0.55, 0.62, 0.55]), color: [2.05, 2.0, 1.94], name: 'key' },
    { dir: S.norm([-0.7, 0.2, 0.35]), color: [0.38, 0.43, 0.56], name: 'fill' },
    { dir: S.norm([-0.25, 0.1, -0.95]), color: [1.05, 1.02, 1.12], name: 'back' } ],
  flat:    [ { dir: S.norm([0.1, 0.25, 0.96]), color: [3.2, 3.2, 3.2], name: 'front' } ],
  back:    [ { dir: S.norm([-0.1, 0.1, -0.98]), color: [4.0, 3.9, 3.8], name: 'back' } ],
  side:    [ { dir: S.norm([0.97, 0.12, 0.2]), color: [3.4, 3.3, 3.2], name: 'side' } ]
};

// ACES-ish tonemap + sRGB, so values are comparable between materials rather than clipped differently
const tone = (x) => { const a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14; return S.sat((x * (a * x + b)) / (x * (c * x + d) + e)); };
const srgb = (x) => (x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055);

function renderSphere(resp, opts) {
  opts = opts || {};
  const W = opts.width || 200, H = opts.height || 200, lights = LIGHTS[opts.lighting || 'studio'];

ission","do":"for thin_wall only: a back-facing term driven by the dot of light direction and inverted normal, tinted by absorption_color","loses":"everything volumetric; adequate for foliage, not for glass"},"verify":["Backlight a leaf. It must go BRIGHTER than the unlit side. If it darkens, this is not bound.","A thick glass block must be clear through the faces and coloured through the edges."]},{"format":"axm-material-response-organ","version":"0.1.0","state_effects":"none","evidence":"declared_contract_match_not_tested","id":"surface.wear_layer","name":"Wear layering","purpose":"Two or three complete surfaces stacked on one object — bare metal, oxide, grime — placed by where an object is worn and where dirt collects. This is what makes something look USED rather than uniformly dirtied.","inputs":[{"id":"layers","type":"list","means":"ordered list of {response, weight, where, mask}"},{"id":"where","type":"enum","options":["high_wear_edges","cavities","upward_faces","folds","contact_points","custom_mask"],"default":"cavities","means":"the placement rule for a layer"},{"id":"weight","type":"scalar","range":[0,1],"default":0,"means":"how strongly that layer covers"}],"outputs":[{"id":"blended_response","means":"a full response per point, blended from the stack"}],"dependencies":["surface.breakup"],"host_binding":{"requires":["curvature and cavity maps per asset, baked once","a per-point blend of complete responses, not of channels"],"binding_note":"Blend COMPLETE responses, not individual channels. Lerping roughness between rust and steel produces a value that is neither, and the surface reads as a decal."},"known_losses":["Placement is geometric, so it cannot know history: which edge was actually gripped, where the rain ran. Those want a painted mask."],"fallback":{"when":"host cannot blend full responses","do":"pick the dominant layer per point with a hard threshold rather than blending","loses":"transition softness; reads as stencilled but stays honest"},"verify":["An aged-steel object must be brightest on the edges hands touch and darkest in the cavities. If wear is even everywhere, placement is not bound."]}];</script>
<script>
(function () {
'use strict';
const $ = (id) => document.getElementById(id), S = window.__shade, R = window.__render;
const el = (t, p, ...k) => { const n = document.createElement(t); for (const a in p || {}) { const v = p[a]; if (v == null || v === false) continue; if (a === 'text') n.textContent = v; else if (a.slice(0, 2) === 'on') n.addEventListener(a.slice(2), v); else if (a in n && a !== 'list') n[a] = v; else n.setAttribute(a, v === true ? '' : v); } for (const c of k.flat(Infinity)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c)); return n; };
const clone = (o) => JSON.parse(JSON.stringify(o));
let toastT; const toast = (m) => { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2600); };

// Which response key belongs to which organ, and what can be dialled on each.
const KEY = { 'surface.subsurface': 'subsurface', 'surface.sheen': 'sheen', 'surface.anisotropy': 'anisotropy', 'surface.coat': 'clearcoat', 'surface.breakup': 'breakup', 'surface.transmission': 'transmission', 'surface.iridescence': 'iridescence', 'surface.wear_layer': 'layers' };
const DIALS = {
  subsurface: [['weight', 0, 1, 0.01], ['radius_mm.0', 0, 6, 0.1], ['radius_mm.1', 0, 6, 0.1], ['radius_mm.2', 0, 6, 0.1]],
  sheen: [['weight', 0, 1, 0.01], ['roughness', 0.05, 1, 0.01]],
  anisotropy: [['strength', -0.95, 0.95, 0.01], ['rotation', 0, 1, 0.01]],
  clearcoat: [['weight', 0, 1, 0.01], ['roughness', 0.01, 0.6, 0.005], ['ior', 1, 2.2, 0.01]],
  breakup: [['roughness_variation', 0, 0.6, 0.01], ['color_variation', 0, 0.4, 0.01], ['scale_mm', 0.2, 40, 0.1]],
  transmission: [['__scalar', 0, 1, 0.01]],
  iridescence: [['weight', 0, 1, 0.01], ['thickness_nm', 150, 900, 5], ['thickness_variation_nm', 0, 500, 5], ['ior', 1, 2.5, 0.01]],
  layers: []
};
const BASE = [['roughness', 0.02, 1, 0.01], ['metallic', 0, 1, 0.01], ['specular', 0, 1, 0.01]];
const DEFAULTS = {
  subsurface: { weight: 0.5, radius_mm: [2.5, 1.2, 0.8], tint: [0.9, 0.4, 0.3] },
  sheen: { weight: 0.5, roughness: 0.3, tint: [1, 1, 1] },
  anisotropy: { strength: 0.7, direction: 'tangent_u', rotation: 0 },
  clearcoat: { weight: 0.8, roughness: 0.05, ior: 1.5 },
  breakup: { roughness_variation: 0.18, color_variation: 0.08, scale_mm: 2.2 },
  transmission: 0.4, iridescence: { weight: 0.7, thickness_nm: 420, thickness_variation_nm: 180, ior: 1.4 },
  layers: [{ kind: 'grime', weight: 0.5, where: 'cavities', base_color: [0.12, 0.1, 0.09], roughness: 0.9, metallic: 0 }]
};
const get = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
const set = (o, p, v) => { const ks = p.split('.'); let a = o; for (let i = 0; i < ks.length - 1; i++) a = a[ks[i]]; a[ks[ks.length - 1]] = v; };

let resp = clone(PACK.families[0].response), light = 'studio', grey = false, spin = 0, spinning = false, raf = 0;

function greyify(r) { const g = clone(r), L = (c) => { const v = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; return [v, v, v]; };
  if (g.base_color) g.base_color = L(g.base_color);
  for (const p of ['subsurface.tint', 'sheen.tint', 'transmission_tint', 'absorption.color', 'flake.color']) { const v = get(g, p); if (v) set(g, p, L(v)); }
  for (const l of g.layers || []) if (l.base_color) l.base_color = L(l.base_color);
  return g; }

function draw() {
  const cv = $('cv'), ctx = cv.getContext('2d');
  const t0 = performance.now();
  const f = R.renderSphere(grey ? greyify(resp) : resp, { width: cv.width, height: cv.height, lighting: light, spin });
  const img = ctx.createImageData(cv.width, cv.height); img.data.set(f.pixels); ctx.putImageData(img, 0, 0);
  const used = S.organsUsed(resp);
  $('stat').textContent = used.length + ' organ' + (used.length === 1 ? '' : 's') + ' bound — ' + (used.map((o) => o.split('.')[1]).join(', ') || 'none, this is plain plastic') + ' · ' + Math.round(performance.now() - t0) + 'ms';
  return f;
}
function loop(ts) { raf = requestAnimationFrame(loop); if (!spinning) return; spin = (ts / 1600) % (Math.PI * 2); draw(); }

// Each organ's verify case, run right here on the current surface.
function verifyOrgan(id) {
  const k = KEY[id], on = clone(resp), off = clone(resp); delete off[k];
  if (k === 'transmission') delete off.transmission_tint;
  const W = 170, mk = (r, o) => R.renderSphere(r, Object.assign({ width: W, height: W, lighting: 'studio' }, o || {})); // matches tools/verify.js closely enough that a pass here means a pass there
  const detail = (f, frac, step) => { const d = step || 3, pts = R.discPoints(f, frac || 0.6).filter((p) => p[0] > d && p[1] > d && p[0] < f.width - d && p[1] < f.height - d && f.hit[p[1] * f.width + p[0]]);
    let a = 0, n = 0; for (const p of pts) { const nb = [[d, 0], [-d, 0], [0, d], [0, -d]].map((q) => [p[0] + q[0], p[1] + q[1]]).filter((q) => f.hit[q[1] * f.width + q[0]]); if (nb.length < 3) continue; const m = nb.reduce((s, q) => s + f.lum(q[0], q[1]), 0) / nb.length; a += Math.abs(f.lum(p[0], p[1]) - m); n++; } return n ? a / n : 0; };
  const peak = (f) => { let b = 0, bx = 0, by = 0; for (let y = 0; y < f.height; y++) for (let x = 0; x < f.width; x++) if (f.hit[y * f.width + x] && f.lum(x, y) > b) { b = f.lum(x, y); bx = x; by = y; } let n = 0; for (let x = 0; x < f.width; x++) if (f.hit[by * f.width + x] && f.lum(x, by) >= b * 0.5) n++; let m = 0; for (let y = 0; y < f.height; y++) if (f.hit[y * f.width + bx] && f.lum(bx, y) >= b * 0.5) m++; return { peak: b, u: n, v: m }; };
  const r2 = (x) => Math.round(x * 100) / 100;
  if (k === 'sheen') { const a = mk(on, { lighting: 'flat' }), b = mk(off, { lighting: 'flat' });
    const ra = R.meanLum(a, R.rimPoints(a, 24)) / Math.max(R.meanLum(a, R.discPoints(a, 0.25)), 1e-4), rb = R.meanLum(b, R.rimPoints(b, 24)) / Math.max(R.meanLum(b, R.discPoints(b, 0.25)), 1e-4);
    return { pass: ra > rb * 1.5 && ra > 1.3, says: 'rim/centre ' + r2(ra) + ' with, ' + r2(rb) + ' without' }; }
  if (k === 'transmission') { const a = mk(on, { lighting: 'back' }), b = mk(off, { lighting: 'back' });
    const la = R.meanLum(a, R.discPoints(a, 0.6)), lb = R.meanLum(b, R.discPoints(b, 0.6));
    return { pass: la > lb * 1.5, says: 'backlit ' + r2(la / Math.max(lb, 1e-4)) + 'x brighter' }; }
  if (k === 'subsurface') { const a = mk(on, { lighting: 'side' }), b = mk(off, { lighting: 'side' });
    const band = []; for (let y = 52; y < 118; y++) for (let x = 72; x < 90; x++) if (a.hit[y * a.width + x]) band.push([x, y]);
    if (!band.length) return { pass: false, says: 'no terminator found' };
    const mean = (f) => band.reduce((s, p) => { const c = f.at(p[0], p[1]); return [s[0] + c[0], s[1] + c[1], s[2] + c[2]]; }, [0, 0, 0]).map((v) => v / band.length);
    const ca = mean(a), cb = mean(b), la = R.meanLum(a, band), lb = R.meanLum(b, band);
    return { pass: la > lb * 1.05 && ca[0] / Math.max(ca[2], 1e-4) > cb[0] / Math.max(cb[2], 1e-4) * 1.02, says: 'terminator ' + r2(la / Math.max(lb, 1e-4)) + 'x brighter, ' + r2((ca[0] / Math.max(ca[2], 1e-4)) / Math.max(cb[0] / Math.max(cb[2], 1e-4), 1e-4)) + 'x redder' }; }
  if (k === 'anisotropy') { const a = peak(mk(on)), b = peak(mk(off));
    const ar = a.u / Math.max(a.v, 1), br = b.u / Math.max(b.v, 1);
    return { pass: Math.abs(Math.log(ar)) > Math.abs(Math.log(br)) + 0.2, says: 'highlight aspect ' + r2(ar) + ' with, ' + r2(br) + ' without' }; }
  if (k === 'clearcoat') { const noFlake = clone(on); delete noFlake.flake; const noFlakeOff = clone(off); delete noFlakeOff.flake;
    const a = peak(mk(noFlake)), b = peak(mk(noFlakeOff));
    return { pass: a.peak > b.peak * 1.5, says: 'peak ' + r2(a.peak / Math.max(b.peak, 1e-4)) + 'x brighter, ' + (b.u - a.u) + 'px tighter' }; }
  if (k === 'iridescence') { const a = mk(on), b = mk(on, { spin: 1.1 }), c = mk(off);
    const hue = (x) => { const mx = Math.max(...x), mn = Math.min(...x); if (mx - mn < 1e-5) return 0; let h; if (mx === x[0]) h = ((x[1] - x[2]) / (mx - mn)) % 6; else if (mx === x[1]) h = (x[2] - x[0]) / (mx - mn) + 2; else h = (x[0] - x[1]) / (mx - mn) + 4; return ((h * 60) + 360) % 360; };
    const pts = R.rimPoints(a, 20, 6), spread = (f) => { const hs = pts.map((p) => hue(f.at(p[0], p[1]))).filter((h) => h > 0); return hs.length > 1 ? Math.max(...hs) - Math.min(...hs) : 0; };
    const moved = pts.reduce((s, p) => s + Math.abs(hue(a.at(p[0], p[1])) - hue(b.at(p[0], p[1]))), 0) / pts.length;
    return { pass: spread(a) > spread(c) + 10 && moved > 3, says: 'hue spread ' + r2(spread(a)) + ' deg, moves ' + r2(moved) + ' deg when turned' }; }
  const a = mk(on), b = mk(off), da = detail(a, 0.8, k === 'layers' ? 4 : 3), db = detail(b, 0.8, k === 'layers' ? 4 : 3);
  return { pass: da > db * 1.5, says: 'local detail ' + r2(da / Math.max(db, 1e-6)) + 'x higher' };
}

function organCard(o) {
  const k = KEY[o.id], bound = resp[k] !== undefined, dials = DIALS[k] || [];
  const head = el('h2', {}, o.name, el('span', { class: 'tag' + (bound ? ' ok' : ''), text: bound ? 'bound' : 'not bound' }));
  const body = [el('p', { class: 'note', text: o.purpose })];
  if (bound) for (const [p, lo, hi, st] of dials) {
    const path = p === '__scalar' ? null : p;
    const cur = path ? get(resp[k], path) : (typeof resp[k] === 'number' ? resp[k] : resp[k].weight);
    if (cur === undefined) continue;
    const out = el('output', { text: String(Math.round(cur * 1000) / 1000 ) });
    body.push(el('label', { class: 'sl' }, el('span', { text: path ? path.replace('radius_mm.0', 'radius red').replace('radius_mm.1', 'radius green').replace('radius_mm.2', 'radius blue') : 'weight' }), out,
      el('input', { type: 'range', min: lo, max: hi, step: st, value: cur, 'aria-label': o.name + ' ' + (path || 'weight'),
        oninput: (e) => { const v = Number(e.target.value); out.textContent = String(v); if (path) set(resp[k], path, v); else if (typeof resp[k] === 'number') resp[k] = v; else resp[k].weight = v; draw(); } })));
  }
  if (bound && o.known_losses) body.push(el('details', {}, el('summary', { class: 'note', text: 'known losses in this host' }), el('ul', { class: 'note' }, o.known_losses.map((l) => el('li', { text: l })))));
  const vtag = el('span', { class: 'tag', text: 'not checked' });
  body.push(el('div', { class: 'row' },
    el('button', { text: bound ? 'Unbind' : 'Bind', onclick: () => { if (bound) delete resp[k]; else resp[k] = clone(DEFAULTS[k]); render(); draw(); } }),
    bound ? el('button', { text: 'Verify', onclick: () => { const r = verifyOrgan(o.id); vtag.textContent = (r.pass ? 'pass — ' : 'FAIL — ') + r.says; vtag.className = 'tag ' + (r.pass ? 'ok' : 'hold'); } }) : null,
    vtag));
  return el('div', { class: 'card' }, head, body);
}

function render() {
  const host = $('organs'); host.textContent = '';
  for (const o of ORGANS) host.append(organCard(o));
  host.append(el('div', { class: 'card' }, el('h2', {}, 'Base'),
    BASE.map(([p, lo, hi, st]) => { const cur = resp[p] === undefined ? (p === 'roughness' ? 0.5 : 0) : resp[p], out = el('output', { text: String(cur) });
      return el('label', { class: 'sl' }, el('span', { text: p }), out, el('input', { type: 'range', min: lo, max: hi, step: st, value: cur, 'aria-label': p, oninput: (e) => { resp[p] = Number(e.target.value); out.textContent = e.target.value; draw(); } })); }),
    el('div', { class: 'row' }, ['base_color'].map(() => el('input', { type: 'color', 'aria-label': 'base colour', value: '#' + (resp.base_color || [0.6, 0.6, 0.6]).map((c) => Math.round(Math.max(0, Math.min(1, c)) * 255).toString(16).padStart(2, '0')).join(''), oninput: (e) => { const h = e.target.value; resp.base_color = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255); draw(); } })))));
  host.append(el('div', { class: 'card' }, el('h2', {}, 'Take it with you'),
    el('p', { class: 'note', text: 'This is the response as the pack stores it. Paste it into axm-material-response-pack.json, or hand it to a host that binds these organs.' }),
    el('pre', { id: 'json', text: JSON.stringify(resp, null, 1) }),
    el('div', { class: 'row' },
      el('button', { class: 'go', text: 'Copy', onclick: () => { const t = JSON.stringify(resp, null, 1); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Copied.'), () => toast('Select the text and copy.')); } }),
      el('button', { text: 'Download', onclick: () => { const b = new Blob([JSON.stringify({ id: 'lab-surface', purpose: 'authored in the material lab', response: resp }, null, 1)], { type: 'application/json' }), u = URL.createObjectURL(b), a = el('a', { href: u, download: 'surface.response.json' }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000); } }),
      el('button', { text: 'Verify all', onclick: () => { let p = 0, n = 0; for (const o of ORGANS) if (resp[KEY[o.id]] !== undefined) { n++; if (verifyOrgan(o.id).pass) p++; } toast(n ? p + ' of ' + n + ' bound organs pass their verify case' : 'Nothing is bound yet.'); render(); } }))));
  $('json') && ($('json').textContent = JSON.stringify(resp, null, 1));
}

// startup
const sel = $('preset');
PACK.families.forEach((f, i) => sel.append(el('option', { value: String(i), text: f.id })));
sel.addEventListener('change', () => { const f = PACK.families[Number(sel.value)]; resp = clone(f.response); $('purpose').textContent = f.purpose || ''; render(); draw(); });
$('purpose').textContent = PACK.families[0].purpose || '';
for (const [id, label] of [['studio', 'studio'], ['flat', 'flat'], ['side', 'side'], ['back', 'back']])
  $('lighting').append(el('button', { text: label, 'aria-pressed': String(id === light), onclick: (e) => { light = id; [...$('lighting').children].forEach((b) => b.setAttribute('aria-pressed', String(b.textContent === label))); draw(); } }));
$('grey').addEventListener('change', (e) => { grey = e.target.checked; draw(); });
$('spin').addEventListener('change', (e) => { spinning = e.target.checked; if (!spinning) draw(); });
const cv = $('cv'); let drag = null;
cv.addEventListener('pointerdown', (e) => { drag = e.clientX; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', (e) => { if (drag === null) return; spin += (e.clientX - drag) * 0.01; drag = e.clientX; draw(); });
cv.addEventListener('pointerup', () => (drag = null));
render(); draw(); raf = requestAnimationFrame(loop);
window.__lab = { get resp() { return resp; }, draw, verifyOrgan };
})();
</script>
