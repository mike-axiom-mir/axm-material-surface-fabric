name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  state-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check state-core.js
          node --check trace-core.js
          node --check trace-down.js
          node --check delta-core.js
          node --check material-delta.js
          node --check library-core.js
          node --check material-library.js
      - name: State, trace, delta, and library tests
        run: npm test
